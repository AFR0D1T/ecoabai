# Бесплатный Render усыпляет сервис через 15 минут без запросов (первый заход потом ждёт ~50 с).
# Этот workflow раз в 10 минут обращается к /api/health, чтобы API не засыпал.
# Адрес задаётся в Settings → Secrets and variables → Actions → Variables → API_HEALTH_URL.
name: keep-api-awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.API_HEALTH_URL != '' }}
    steps:
      - run: curl -fsS --max-time 90 --retry 2 "$URL"
        env:
          URL: ${{ vars.API_HEALTH_URL }}
