<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2e7d32" />
    <meta name="description" content="EcoAbai — карта экологических проблем, субботники и эко-рейтинг села Абай" />
    <title>EcoAbai</title>
    <!-- PWA: установка на главный экран телефона -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="EcoAbai" />
    <meta name="format-detection" content="telephone=no" />
    <!-- заранее открываем соединения к серверам карты — быстрее первая отрисовка на мобильном интернете -->
    <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin />
    <link rel="dns-prefetch" href="https://server.arcgisonline.com" />
    <style>
      /* фон до загрузки CSS — без белой вспышки в тёмной теме */
      html { background: #f4f8f2; }
      html.dark { background: #101a12; }
    </style>
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
