# Продакшен на одном сервере: Caddy (HTTPS + фронт) → FastAPI → Postgres.
# Запуск: cp deploy/.env.example .env && nano .env && docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecoabai
      POSTGRES_USER: ecoabai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecoabai -d ecoabai"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ECOABAI_ENV: prod
      ECOABAI_SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ECOABAI_DATABASE_URL: postgresql+psycopg://ecoabai:${POSTGRES_PASSWORD}@db:5432/ecoabai
      ECOABAI_COOKIE_SECURE: "true"
      ECOABAI_ALLOWED_ORIGINS: '["https://${DOMAIN}"]'
      ECOABAI_FRONTEND_URL: https://${DOMAIN}
      ECOABAI_SEED_DEMO: ${SEED_DEMO:-false}
      ECOABAI_DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      ECOABAI_ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ECOABAI_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    depends_on: [api]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
